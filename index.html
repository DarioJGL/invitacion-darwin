<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feliz Aniversario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0d0610;
    --bg-2: #1c0a22;
    --bg-3: #2a0d33;
    --pink: #ff3d9a;
    --pink-2: #e0218a;
    --purple: #a42bd9;
    --rose: #f5a3c7;
    --text: #f6e9f2;
    --muted: #a88aa0;
    --glass: rgba(255, 255, 255, 0.045);
    --glass-border: rgba(255, 255, 255, 0.08);
    --paper: #f6ead6;
    --paper-dark: #e7d2b2;
    --wood: #8a5a32;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-1);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, #3a1045 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, #2b0a35 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1));
  }

  /* Rayos de luz verticales sutiles */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(90deg,
      transparent 0 38px,
      rgba(255, 80, 180, 0.025) 38px 40px,
      transparent 40px 80px);
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Corazones flotantes de fondo ---------- */
  #hearts-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .float-heart {
    position: absolute;
    top: -30px;
    color: var(--pink-2);
    filter: blur(var(--blur, 0px)) drop-shadow(0 0 6px rgba(255, 40, 120, .6));
    animation: fall linear forwards;
    opacity: var(--op, .7);
  }
  .sparkle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px 2px rgba(255, 255, 255, .6);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(55vh) translateX(var(--drift, 20px)) rotate(20deg); }
    100% { transform: translateY(110vh) translateX(0) rotate(-15deg); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.5); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Pantallas ---------- */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .8s ease, visibility .8s ease, transform .8s ease;
    transform: scale(1.03);
  }
  .screen.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
  }
  .container { width: 100%; max-width: 400px; }

  /* ---------- Pantalla de bloqueo ---------- */
  #lock { text-align: center; }
  .big-heart {
    font-size: 46px;
    display: inline-block;
    animation: beat 1.3s ease-in-out infinite;
    filter: drop-shadow(0 0 18px rgba(255, 30, 80, .75));
    margin-bottom: 26px;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
  .title-lock {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(22px, 6.5vw, 30px);
    letter-spacing: 4px;
    background: linear-gradient(180deg, #ffd6ea, #f07ab6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(255, 61, 154, .25);
  }
  .subtitle-lock {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 8px;
    letter-spacing: .3px;
  }
  .pin-dots {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 30px 0 32px;
  }
  .pin-dots span {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .55);
    transition: all .25s ease;
  }
  .pin-dots span.filled {
    background: var(--pink);
    border-color: var(--pink);
    box-shadow: 0 0 12px var(--pink), 0 0 2px #fff inset;
    transform: scale(1.08);
  }
  .pin-dots.error { animation: shake .45s ease; }
  .pin-dots.error span { border-color: #ff4d4d; background: transparent; box-shadow: none; }
  .pin-dots.success span { background: #ff6fb5; box-shadow: 0 0 16px var(--pink); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    gap: 18px 26px;
    justify-content: center;
  }
  .key {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .05);
    background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
    color: var(--text);
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    font-weight: 300;
    cursor: pointer;
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 6px 18px rgba(0, 0, 0, .3);
  }
  .key:active, .key.pressed {
    transform: scale(.92);
    background: radial-gradient(circle, rgba(255, 61, 154, .45), rgba(164, 43, 217, .2));
    box-shadow: 0 0 22px rgba(255, 61, 154, .5);
  }
  .key.action { color: var(--pink); font-size: 18px; font-weight: 500; }
  .hint {
    margin-top: 26px;
    font-size: 11px;
    color: rgba(168, 138, 160, .6);
    min-height: 16px;
  }

  /* ---------- Pantalla principal ---------- */
  #main { justify-content: center; }
  .music-pill {
    position: absolute;
    top: 18px; right: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 12px;
    border-radius: 30px;
    border: 1px solid rgba(255, 61, 154, .55);
    background: rgba(40, 10, 45, .7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 14px rgba(255, 61, 154, .35);
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    z-index: 20;
  }
  .eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .eq i {
    width: 2px; height: 4px;
    background: var(--pink);
    border-radius: 1px;
  }
  .music-pill.playing .eq i { animation: eq .9s ease-in-out infinite; }
  .music-pill.playing .eq i:nth-child(2) { animation-delay: .2s; }
  .music-pill.playing .eq i:nth-child(3) { animation-delay: .4s; }
  .music-pill.playing .eq i:nth-child(4) { animation-delay: .1s; }
  @keyframes eq {
    0%, 100% { height: 3px; }
    50% { height: 12px; }
  }

  .title-main {
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    text-align: center;
    font-size: clamp(24px, 7vw, 31px);
    letter-spacing: 3px;
    line-height: 1.25;
    background: linear-gradient(180deg, #ffe3f1, #f292c2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .since {
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    margin: 10px 0 26px;
  }
  .counter {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .box {
    aspect-ratio: 1 / .92;
    border-radius: 14px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 10px 25px rgba(0, 0, 0, .25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .box .num {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 8vw, 34px);
    font-weight: 600;
    color: #fff;
    line-height: 1;
    transition: transform .3s ease, color .3s ease;
  }
  .box .num.tick { animation: tick .5s ease; }
  @keyframes tick {
    0% { transform: translateY(-4px); color: var(--pink); }
    100% { transform: translateY(0); color: #fff; }
  }
  .box .lbl {
    margin-top: 8px;
    font-size: 9.5px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .btns { margin-top: 34px; display: flex; flex-direction: column; gap: 14px; }
  .btn {
    width: 100%;
    padding: 16px;
    border-radius: 30px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .3s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-outline {
    background: rgba(70, 20, 70, .45);
    border: 1px solid rgba(255, 61, 154, .5);
    box-shadow: 0 0 16px rgba(255, 61, 154, .18);
  }
  .btn-fill {
    border: none;
    background: linear-gradient(90deg, var(--pink-2), #c02ad8 60%, var(--purple));
    box-shadow: 0 8px 28px rgba(224, 33, 138, .45);
  }
  .btn-fill:hover, .btn-outline:hover { box-shadow: 0 0 30px rgba(255, 61, 154, .55); }

  /* ---------- Overlays (recuerdos / carta) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: radial-gradient(ellipse at 50% 40%, #241030 0%, #0c0510 75%);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity .6s ease, visibility .6s ease;
  }
  .overlay.active { opacity: 1; visibility: visible; }
  .close-btn {
    position: absolute;
    top: 18px; left: 16px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .08);
    background: rgba(255, 255, 255, .07);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }
  .overlay-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 19px;
    color: var(--rose);
    margin-top: 26px;
    text-shadow: 0 0 14px rgba(255, 61, 154, .35);
  }

  /* Carrusel */
  .carousel-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .carousel {
    position: relative;
    width: 100%;
    max-width: 440px;
    height: min(62vh, 440px);
    perspective: 1100px;
    touch-action: pan-y;
  }
  .card {
    position: absolute;
    left: 50%; top: 50%;
    width: min(64vw, 270px);
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.22, .8, .25, 1), opacity .65s ease, filter .65s ease, box-shadow .65s ease;
    background: linear-gradient(160deg, #3c1544, #1a0820);
    border: 2px solid transparent;
    cursor: grab;
    user-select: none;
  }
  .card.center {
    border-color: #ff5fb0;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset, 0 0 28px rgba(255, 61, 154, .55), 0 20px 50px rgba(0, 0, 0, .6);
  }
  .card img {
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none;
    display: block;
  }
  .card .ph {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px;
  }
  .card .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 46px 14px 16px;
    text-align: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: #fff;
    background: linear-gradient(0deg, rgba(20, 5, 25, .85), transparent);
    text-shadow: 0 2px 6px rgba(0, 0, 0, .6);
  }
  /* Botón "siguiente" convertido en sobre al llegar a la última foto */
  .nav-btn.gift {
    width: auto;
    padding: 0 16px;
    border-radius: 21px;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    background: linear-gradient(90deg, var(--pink-2), var(--purple));
    border: none;
    box-shadow: 0 0 20px rgba(255, 61, 154, .55);
    animation: pulse 1.8s ease-in-out infinite;
  }
  .nav-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }

  /* ---------- Invitación ---------- */
  #invite { justify-content: center; padding: 64px 16px 20px; }
  .invite-stage {
    width: 100%;
    max-width: 420px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Sobre */
  .envelope-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: opacity .5s ease, transform .6s ease;
  }
  .envelope-wrap.gone { opacity: 0; transform: translateY(40px) scale(.9); pointer-events: none; }
  .env-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--rose);
    margin-bottom: 26px;
    text-shadow: 0 0 14px rgba(255, 61, 154, .4);
  }
  .env-hint { margin-top: 26px; font-size: 12px; color: var(--muted); animation: twinkle 2.4s ease-in-out infinite; }
  .envelope {
    position: relative;
    width: 280px;
    height: 185px;
    perspective: 800px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .5)) drop-shadow(0 0 22px rgba(255, 61, 154, .25));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .env-back, .env-front, .env-flap { position: absolute; inset: 0; border-radius: 10px; }
  .env-back { background: linear-gradient(160deg, #5a1a5e, #3a0f40); }
  .env-paper {
    position: absolute;
    left: 14px; right: 14px; top: 14px; height: 150px;
    border-radius: 6px;
    background: linear-gradient(180deg, #fff6f9, #f7e3ec);
    transition: transform .7s ease .35s;
  }
  .env-front {
    background: linear-gradient(160deg, #7a2378, #4a1250);
    clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    background: linear-gradient(180deg, #8e2a8a, #5e1863);
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transform-origin: top;
    transition: transform .6s ease;
    z-index: 3;
  }
  .seal {
    position: absolute;
    left: 50%; top: 58%;
    width: 46px; height: 46px;
    margin: -23px 0 0 -23px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff7ab8, #c4146c);
    box-shadow: 0 3px 10px rgba(0, 0, 0, .4), inset 0 0 0 3px rgba(255, 255, 255, .15);
    z-index: 4;
    transition: opacity .3s ease, transform .3s ease;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .envelope.open .seal { opacity: 0; transform: scale(.4); }
  .envelope.open .env-paper { transform: translateY(-70px); }

  /* Tarjeta */
  .invite-card {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 100%;
    height: min(100%, 700px);
    border-radius: 24px;
    padding: 40px 26px 30px;
    text-align: center;
    overflow-y: auto;
    scrollbar-width: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255, 61, 154, .28), transparent 55%),
      radial-gradient(ellipse at 50% 115%, rgba(164, 43, 217, .3), transparent 55%),
      linear-gradient(165deg, #2c0f35, #160719);
    border: 1px solid rgba(245, 163, 199, .35);
    box-shadow: 0 0 50px rgba(255, 61, 154, .25), 0 30px 60px rgba(0, 0, 0, .55);
    opacity: 0;
    transform: translateY(60px) scale(.94);
    pointer-events: none;
    transition: opacity .7s ease, transform .8s cubic-bezier(.2, .8, .25, 1);
  }
  .invite-card::-webkit-scrollbar { display: none; }
  .invite-card.show { opacity: 1; transform: none; pointer-events: auto; }
  .invite-card::before {
    content: '';
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(245, 163, 199, .2);
    border-radius: 17px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 30px; height: 30px;
    border: 0 solid var(--rose);
    opacity: .7;
    pointer-events: none;
  }
  .corner.tl { top: 18px; left: 18px; border-top-width: 1.5px; border-left-width: 1.5px; border-top-left-radius: 12px; }
  .corner.tr { top: 18px; right: 18px; border-top-width: 1.5px; border-right-width: 1.5px; border-top-right-radius: 12px; }
  .corner.bl { bottom: 18px; left: 18px; border-bottom-width: 1.5px; border-left-width: 1.5px; border-bottom-left-radius: 12px; }
  .corner.br { bottom: 18px; right: 18px; border-bottom-width: 1.5px; border-right-width: 1.5px; border-bottom-right-radius: 12px; }

  .inv-kicker {
    font-size: 10.5px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--rose);
    opacity: .85;
  }
  .inv-icon {
    width: 78px; height: 78px;
    margin: 18px auto 14px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    background: radial-gradient(circle, rgba(255, 61, 154, .25), rgba(255, 61, 154, .05));
    border: 1px solid rgba(245, 163, 199, .4);
    box-shadow: 0 0 26px rgba(255, 61, 154, .35);
    animation: beat 2.2s ease-in-out infinite;
  }
  .inv-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(30px, 9vw, 38px);
    line-height: 1.15;
    background: linear-gradient(180deg, #fff0f7, #f292c2);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .inv-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px auto;
    width: 70%;
    color: var(--pink);
    font-size: 12px;
  }
  .inv-divider::before, .inv-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245, 163, 199, .6), transparent);
  }
  .inv-msg {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    line-height: 1.65;
    color: #ecd8e5;
    max-width: 300px;
    margin: 0 auto;
  }
  .inv-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 24px 0 26px;
  }
  .inv-tile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 14px;
    text-align: left;
    background: rgba(255, 255, 255, .045);
    border: 1px solid rgba(255, 255, 255, .08);
  }
  .inv-tile.wide { grid-column: span 2; }
  .inv-tile .ic { font-size: 20px; }
  .inv-tile .lb {
    display: block;
    font-size: 9px;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .inv-tile .tx { display: block; font-size: 13.5px; font-weight: 500; color: #fff; }
  .inv-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .inv-yes {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, var(--pink-2), #c02ad8 60%, var(--purple));
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .5px;
    cursor: pointer;
    animation: pulse 2s ease-in-out infinite;
  }
  .inv-no {
    padding: 8px 26px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, .15);
    background: rgba(255, 255, 255, .06);
    color: var(--muted);
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: left .25s ease, top .25s ease;
  }
  .inv-no.dodging { position: absolute; z-index: 3; }
  .inv-done { display: none; }
  .inv-done.show { display: block; animation: tick .7s ease; }
  .inv-done strong {
    display: block;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 28px;
    color: var(--rose);
    text-shadow: 0 0 18px rgba(255, 61, 154, .55);
  }
  .inv-done span { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .invite-card.accepted .inv-actions { display: none; }

  @media (max-height: 700px) {
    .invite-card { padding: 32px 22px 24px; }
    .inv-icon { width: 60px; height: 60px; font-size: 28px; margin: 12px auto 10px; }
    .inv-details { margin: 16px 0 18px; }
  }

  .glow-floor {
    width: 70%;
    max-width: 300px;
    height: 34px;
    margin-top: 6px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 61, 154, .22), transparent 70%);
    filter: blur(6px);
  }
  .car-nav {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 14px 0 36px;
  }
  .nav-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .08);
    background: rgba(255, 255, 255, .06);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: box-shadow .3s ease, background .3s ease;
  }
  .nav-btn:hover { box-shadow: 0 0 16px rgba(255, 61, 154, .5); background: rgba(255, 61, 154, .15); }
  .dots { display: flex; gap: 5px; align-items: center; }
  .dots span {
    width: 5px; height: 5px;
    border-radius: 3px;
    background: rgba(255, 255, 255, .35);
    transition: all .35s ease;
  }
  .dots span.on { width: 18px; background: var(--pink); box-shadow: 0 0 8px var(--pink); }

  /* Carta / pergamino */
  #letter { justify-content: center; padding: 70px 16px 30px; }
  .scroll {
    width: 100%;
    max-width: 400px;
    height: 100%;
    max-height: 640px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .rod {
    height: 14px;
    border-radius: 7px;
    background: linear-gradient(180deg, #c48a52, var(--wood) 55%, #5a3518);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .5);
    position: relative;
    z-index: 2;
    margin: 0 -8px;
  }
  .rod::before, .rod::after {
    content: '';
    position: absolute;
    top: -3px;
    width: 12px; height: 20px;
    border-radius: 5px;
    background: linear-gradient(180deg, #a26c3c, #4e2c12);
  }
  .rod::before { left: -6px; }
  .rod::after { right: -6px; }
  .paper {
    flex: 1;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(160, 110, 60, .22) 100%),
      linear-gradient(180deg, var(--paper-dark), var(--paper) 8%, var(--paper) 92%, var(--paper-dark));
    margin: -4px 0;
    max-height: 0;
    transition: max-height 1.6s cubic-bezier(.6, .05, .25, 1);
  }
  #letter.active .paper { max-height: 2000px; }
  .paper-inner {
    height: 100%;
    overflow-y: auto;
    padding: 30px 26px 30px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
  }
  .paper-inner::-webkit-scrollbar { display: none; }
  .letter-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 22px;
    color: #a2245f;
    text-align: center;
    margin-bottom: 20px;
  }
  .letter-body p {
    font-family: 'Playfair Display', serif;
    font-size: 14.5px;
    line-height: 1.85;
    color: #3d2b22;
    margin-bottom: 18px;
  }
  .signature {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    text-align: right;
    color: #b2236a;
    font-size: 15px;
    margin: 8px 0 26px;
  }
  .love-btn {
    display: block;
    margin: 0 auto 10px;
    padding: 13px 44px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(90deg, #ff4fa3, #c12bdc);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(224, 33, 138, .5);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 26px rgba(224, 33, 138, .45); transform: scale(1); }
    50% { box-shadow: 0 8px 40px rgba(224, 33, 138, .85); transform: scale(1.04); }
  }

  /* Explosión de corazones */
  .burst-heart {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    font-size: 22px;
    animation: burst 1.6s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(.4); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) scale(1.3) rotate(var(--r)); opacity: 0; }
  }

  /* Transición de desbloqueo */
  #flash {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    background: radial-gradient(circle, rgba(255, 61, 154, .55), transparent 70%);
    opacity: 0;
    transition: opacity .6s ease;
  }
  #flash.on { opacity: 1; }

  .title-main { white-space: pre-line; }

  /* Aviso cuando no se puede leer el JSON */
  #loader { z-index: 60; text-align: center; }
  .loader-card {
    max-width: 340px;
    padding: 28px 24px;
    border-radius: 18px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
  }
  .loader-card h2 {
    font-family: 'Playfair Display', serif;
    color: var(--rose);
    font-size: 20px;
    margin-bottom: 10px;
  }
  .loader-card code { color: var(--text); }
  .loader-card .btn { display: block; margin-top: 18px; }
  .loader-card input { display: none; }

  @media (max-height: 680px) {
    .keypad { grid-template-columns: repeat(3, 62px); gap: 12px 22px; }
    .key { width: 62px; height: 62px; font-size: 22px; }
    .big-heart { margin-bottom: 14px; font-size: 38px; }
    .pin-dots { margin: 20px 0 22px; }
  }
</style>
</head>
<body>

<div id="hearts-bg"></div>
<div id="flash"></div>

<!-- ============ 0. CARGA DEL JSON ============ -->
<section class="screen" id="loader">
  <div class="loader-card">
    <h2>No se pudo cargar los datos</h2>
    <p>El navegador bloquea la lectura de <code>data.json</code> al abrir la página directamente desde el disco.
      Súbela a un hosting (Netlify, GitHub Pages…) o abre la carpeta con un servidor local.</p>
    <label class="btn btn-fill">Elegir data.json<input type="file" id="jsonFile" accept=".json,application/json"></label>
  </div>
</section>

<!-- ============ 1. PANTALLA DE BLOQUEO ============ -->
<section class="screen" id="lock">

    <div class="big-heart" id="lockIcon"></div>
    <h1 class="title-lock" id="lockTitle"></h1>

<!-- ============ 2. PANTALLA PRINCIPAL ============ -->
<section class="screen" id="main">

    <span class="eq"><i></i><i></i><i></i><i></i></span>
    <span>♫ <span id="coupleNames"></span></span>
  </button>
  <div class="container">
    <h2 class="title-main" id="mainTitle"></h2>
    <p class="since" id="sinceText"></p>
    <div class="counter" id="counter"></div>
    <div class="btns">
      <button class="btn btn-outline" id="openMemories"></button>

</section>

<!-- ============ 3. RECUERDOS ============ -->
<section class="overlay" id="memories">
  <button class="close-btn" data-close aria-label="Cerrar">✕</button>
  <h3 class="overlay-title" id="memoriesTitle"></h3>
  <div class="carousel-wrap">

  </div>

    <button class="nav-btn" id="nextBtn" aria-label="Siguiente">›</button>
  </div>

<!-- ============ 3b. INVITACIÓN ============ -->
<section class="overlay" id="invite">
  <button class="close-btn" data-close aria-label="Cerrar">✕</button>
  <div class="invite-stage">
    <div class="envelope-wrap" id="envelopeWrap">
      <p class="env-text" id="envText"></p>
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>

    </div>
    <article class="invite-card" id="inviteCard">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <p class="inv-kicker" id="invKicker"></p>
      <div class="inv-icon" id="invIcon"></div>
      <h3 class="inv-title" id="invTitle"></h3>

      <div class="inv-details" id="invDetails"></div>
      <div class="inv-actions">
        <button class="inv-yes" id="invYes"></button>
        <button class="inv-no" id="invNo"></button>
      </div>

        <strong id="invDoneTitle"></strong>
        <span id="invDoneNote"></span>
      </div>
    </article>
  </div>
</section>

<!-- ============ 4. CARTA ============ -->
<section class="overlay" id="letter">
  <button class="close-btn" data-close aria-label="Cerrar">✕</button>
  <div class="scroll">
    <div class="rod"></div>
    <div class="paper">
      <div class="paper-inner">
        <h3 class="letter-title" id="letterTitle"></h3>
        <div class="letter-body" id="letterBody"></div>
        <p class="signature" id="signature"></p>
        <button class="love-btn" id="loveBtn"></button>
      </div>
    </div>
    <div class="rod"></div>
  </div>
</section>

<script>
/* =========================================================
   Todo el contenido se carga desde data.json.
   Se puede usar otro archivo con ?data=otro.json en la URL.
   ========================================================= */
const DATA_URL = new URLSearchParams(location.search).get('data') || 'data.json';

/* ---------- Utilidades ---------- */
const $ = (s) => document.querySelector(s);
const rand = (a, b) => Math.random() * (b - a) + a;
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- Corazones de fondo (no dependen de los datos) ---------- */
const heartsBg = $('#hearts-bg');
function spawnHeart() {
  const h = document.createElement('span');
  h.className = 'float-heart';
  h.textContent = '❤';
  const size = rand(8, 20);
  h.style.left = rand(0, 100) + 'vw';
  h.style.fontSize = size + 'px';
  h.style.setProperty('--drift', rand(-40, 40) + 'px');
  h.style.setProperty('--op', rand(.35, .85));
  h.style.setProperty('--blur', size < 11 ? '1px' : '0px');
  h.style.animationDuration = rand(7, 14) + 's';
  heartsBg.appendChild(h);
  h.addEventListener('animationend', () => h.remove());
}
for (let i = 0; i < 14; i++) setTimeout(spawnHeart, i * 350);
setInterval(spawnHeart, 700);
for (let i = 0; i < 18; i++) {
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.style.left = rand(0, 100) + 'vw';
  s.style.top = rand(0, 100) + 'vh';
  s.style.animationDelay = rand(0, 3) + 's';
  s.style.animationDuration = rand(2, 4.5) + 's';
  heartsBg.appendChild(s);
}

/* ---------- Explosión de corazones ---------- */
function burst(x, y, count) {
  const icons = ['❤️', '💖', '💕', '💗', '💘'];
  for (let i = 0; i < count; i++) {
    const h = document.createElement('span');
    h.className = 'burst-heart';
    h.textContent = icons[i % icons.length];
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    const ang = rand(0, Math.PI * 2);
    const dist = rand(80, 240);
    h.style.setProperty('--x', Math.cos(ang) * dist + 'px');
    h.style.setProperty('--y', Math.sin(ang) * dist - 60 + 'px');
    h.style.setProperty('--r', rand(-60, 60) + 'deg');
    h.style.fontSize = rand(14, 28) + 'px';
    document.body.appendChild(h);
    h.addEventListener('animationend', () => h.remove());
  }
}

/* ---------- Carga del JSON ---------- */
fetch(DATA_URL, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(init)
  .catch(() => {
    // Abierto desde file:// o JSON inexistente: permitir elegir el archivo a mano
    $('#loader').classList.add('active');
    $('#jsonFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      file.text().then(t => {
        try {
          init(JSON.parse(t));
          $('#loader').classList.remove('active');
        } catch (err) {
          alert('El archivo no es un JSON válido: ' + err.message);
        }
      });
    });
  });

function init(D) {
  /* ---------- Tema y textos ---------- */
  if (D.pageTitle) document.title = D.pageTitle;
  const themeVars = { pink: '--pink', pink2: '--pink-2', purple: '--purple', rose: '--rose' };
  for (const k in D.theme || {}) {
    if (themeVars[k]) document.documentElement.style.setProperty(themeVars[k], D.theme[k]);
  }
  $('#lockIcon').textContent = D.lock.icon;
  $('#lockTitle').textContent = D.lock.title;
  $('#lockSubtitle').textContent = D.lock.subtitle;
  $('#mainTitle').textContent = D.main.title;
  $('#openMemories').textContent = D.main.memoriesButton;
  $('#openLetter').textContent = D.main.letterButton;
  $('#coupleNames').textContent = D.couple.names;
  $('#memoriesTitle').textContent = D.memories.title;
  $('#letterTitle').textContent = D.letter.title;
  $('#signature').textContent = D.letter.signature;
  $('#loveBtn').textContent = D.letter.button;
  const body = $('#letterBody');
  D.letter.paragraphs.forEach(t => {
    const p = document.createElement('p');
    p.textContent = t;
    body.appendChild(p);
  });

  $('#lock').classList.add('active');

  /* ---------- Pantalla de bloqueo ---------- */
  const CODE = String(D.lock.code);
  const pinDots = $('#pinDots');
  const keypad = $('#keypad');
  let pin = '';
  for (let i = 0; i < CODE.length; i++) pinDots.appendChild(document.createElement('span'));

  ['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k => {
    const b = document.createElement('button');
    b.className = 'key' + (k === 'C' || k === '⌫' ? ' action' : '');
    b.textContent = k;
    b.dataset.key = k;
    b.addEventListener('click', () => press(k));
    keypad.appendChild(b);
  });

  function renderPin() {
    [...pinDots.children].forEach((d, i) => d.classList.toggle('filled', i < pin.length));
  }
  let locked = false;
  function press(k) {
    if (locked) return;
    if (k === 'C') pin = '';
    else if (k === '⌫') pin = pin.slice(0, -1);
    else if (pin.length < CODE.length) pin += k;
    renderPin();
    if (pin.length === CODE.length) checkPin();
  }
  let fails = 0;
  function checkPin() {
    locked = true;
    if (pin === CODE) {
      pinDots.classList.add('success');
      setTimeout(unlock, 450);
    } else {
      fails++;
      pinDots.classList.add('error');
      if (navigator.vibrate) navigator.vibrate(200);
      $('#hint').textContent = fails >= (D.lock.failsBeforeHint || 3) ? D.lock.hint : D.lock.errorMessage;
      setTimeout(() => {
        pinDots.classList.remove('error');
        pin = '';
        renderPin();
        locked = false;
      }, 600);
    }
  }
  document.addEventListener('keydown', (e) => {
    if (!$('#lock').classList.contains('active')) {
      if (e.key === 'Escape') closeOverlays();
      if ($('#memories').classList.contains('active')) {
        if (e.key === 'ArrowLeft') go(-1);
        if (e.key === 'ArrowRight') go(1);
      }
      return;
    }
    let k = null;
    if (/^\d$/.test(e.key)) k = e.key;
    else if (e.key === 'Backspace') k = '⌫';
    else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') k = 'C';
    if (!k) return;
    const btn = keypad.querySelector(`[data-key="${k}"]`);
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 130);
    press(k);
  });

  function unlock() {
    $('#flash').classList.add('on');
    burst(window.innerWidth / 2, window.innerHeight / 2, 28);
    if (D.music.autoplay !== false) startMusic();
    setTimeout(() => {
      $('#lock').classList.remove('active');
      $('#main').classList.add('active');
      $('#flash').classList.remove('on');
    }, 500);
  }

  /* ---------- Contador ---------- */
  const start = new Date(D.couple.startDate);
  $('#sinceText').textContent = D.main.since
    .replace('{dia}', start.getDate())
    .replace('{mes}', MONTHS[start.getMonth()])
    .replace('{anio}', start.getFullYear());

  const counter = $('#counter');
  ['years', 'months', 'days', 'hours', 'minutes', 'seconds'].forEach(key => {
    const box = document.createElement('div');
    box.className = 'box';
    box.innerHTML = `<span class="num" id="c-${key}">0</span><span class="lbl"></span>`;
    box.querySelector('.lbl').textContent = D.main.labels[key];
    counter.appendChild(box);
  });

  function diff(from, to) {
    let y = to.getFullYear() - from.getFullYear();
    let m = to.getMonth() - from.getMonth();
    let anchor = new Date(from);
    anchor.setFullYear(from.getFullYear() + y);
    anchor.setMonth(from.getMonth() + m);
    if (anchor > to) {
      m--;
      anchor = new Date(from);
      anchor.setFullYear(from.getFullYear() + y);
      anchor.setMonth(from.getMonth() + m);
    }
    if (m < 0) { y--; m += 12; }
    let ms = to - anchor;
    const d = Math.floor(ms / 864e5); ms -= d * 864e5;
    const h = Math.floor(ms / 36e5); ms -= h * 36e5;
    const mi = Math.floor(ms / 6e4); ms -= mi * 6e4;
    const s = Math.floor(ms / 1e3);
    return { years: y, months: m, days: d, hours: h, minutes: mi, seconds: s };
  }
  const prev = {};
  function updateCounter() {
    const t = diff(start, new Date());
    for (const key in t) {
      const el = document.getElementById('c-' + key);
      if (prev[key] !== t[key]) {
        el.textContent = t[key];
        if (prev[key] !== undefined) {
          el.classList.remove('tick');
          void el.offsetWidth;
          el.classList.add('tick');
        }
        prev[key] = t[key];
      }
    }
  }
  updateCounter();
  setInterval(updateCounter, 1000);

  /* ---------- Música ---------- */
  const pill = $('#musicPill');
  let audio = null, synth = null, playing = false;

  function createSynth() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = .18;
    master.connect(ctx.destination);
    // Melodía tipo caja de música (Do mayor, suave)
    const notes = [
      [523.25, 659.25], [659.25], [783.99], [659.25], [698.46, 880], [659.25], [587.33], [523.25],
      [440, 659.25], [523.25], [659.25], [587.33], [493.88, 783.99], [587.33], [659.25], [523.25]
    ];
    let i = 0, timer = null;
    function play() {
      const now = ctx.currentTime;
      notes[i % notes.length].forEach(f => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = f;
        g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(.5, now + .02);
        g.gain.exponentialRampToValueAtTime(.001, now + 1.6);
        o.connect(g); g.connect(master);
        o.start(now); o.stop(now + 1.7);
      });
      i++;
    }
    return {
      start() { ctx.resume(); play(); timer = setInterval(play, 480); },
      stop() { clearInterval(timer); }
    };
  }
  /* YouTube: se usa el reproductor oficial oculto (IFrame API).
     Se carga desde el inicio para que playVideo() pueda llamarse
     justo después del toque del usuario (los navegadores lo exigen). */
  function youtubeId(url) {
    const m = String(url).match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  const ytId = youtubeId(D.music.url || '');
  let yt = null, ytReady = false, ytFailed = false, ytPending = false;
  if (ytId) {
    const holder = document.createElement('div');
    holder.id = 'yt-player';
    holder.style.cssText = 'position:fixed;width:1px;height:1px;left:-10px;bottom:0;opacity:0;pointer-events:none;';
    document.body.appendChild(holder);
    const startAt = parseInt((String(D.music.url).match(/[?&]t=(\d+)/) || [])[1] || D.music.start || 0, 10);
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt-player', {
        width: 1, height: 1,
        videoId: ytId,
        playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: ytId, start: startAt, playsinline: 1 },
        events: {
          onReady: () => {
            ytReady = true;
            yt.setVolume(D.music.volume ?? 70);
            if (ytPending) yt.playVideo();
          },
          // Video con inserción desactivada o inexistente: se usa la melodía generada
          onError: () => {
            ytFailed = true;
            if (playing) { synth = synth || createSynth(); if (synth) synth.start(); }
          }
        }
      });
    };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  }

  function startMusic() {
    if (playing) return;
    if (ytId && !ytFailed) {
      if (ytReady) yt.playVideo();
      else ytPending = true;
      // Algunos videos bloquean la inserción sin lanzar onError: si no arranca, melodía de respaldo
      setTimeout(() => {
        if (!playing || ytFailed) return;
        if (!ytReady || yt.getCurrentTime() === 0) {
          ytFailed = true;
          if (ytReady) yt.stopVideo();
          synth = synth || createSynth();
          if (synth) synth.start();
        }
      }, 6000);
    } else if (D.music.url && !ytId) {
      audio = audio || new Audio(D.music.url);
      audio.loop = true;
      audio.play().catch(() => {});
    } else {
      synth = synth || createSynth();
      if (synth) synth.start();
    }
    playing = true;
    pill.classList.add('playing');
  }
  function stopMusic() {
    ytPending = false;
    if (ytReady) yt.pauseVideo();
    if (audio) audio.pause();
    if (synth) synth.stop();
    playing = false;
    pill.classList.remove('playing');
  }
  pill.addEventListener('click', () => playing ? stopMusic() : startMusic());

  /* ---------- Carrusel de recuerdos ---------- */
  const carousel = $('#carousel');
  const dotsEl = $('#dots');
  let current = 0;
  const cards = D.memories.items.map((m, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    buildPhoto(c, m);
    c.addEventListener('click', () => { if (i !== current) { current = i; layout(); } });
    carousel.appendChild(c);
    dotsEl.appendChild(document.createElement('span'));
    return c;
  });

  function buildPhoto(c, m) {
    const img = new Image();
    img.alt = m.caption;
    img.src = m.img;
    img.onerror = () => {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = m.emoji || '❤️';
      img.replaceWith(ph);
    };
    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.textContent = m.caption;
    c.append(img, cap);
  }

  /* ---------- Invitación (se abre al terminar el carrusel) ---------- */
  const INV = D.invite;
  const envWrap = $('#envelopeWrap');
  const envelope = $('#envelope');
  const card = $('#inviteCard');
  const no = $('#invNo');
  if (INV) {
    $('#envText').textContent = INV.envelopeText;
    $('#envHint').textContent = INV.envelopeHint;
    $('#invKicker').textContent = INV.kicker;
    $('#invIcon').textContent = INV.emoji;
    $('#invTitle').textContent = INV.title;
    $('#invMsg').textContent = INV.message;
    const details = $('#invDetails');
    (INV.details || []).forEach(d => {
      const tile = document.createElement('div');
      tile.className = 'inv-tile' + (d.wide ? ' wide' : '');
      tile.innerHTML = '<span class="ic"></span><span><span class="lb"></span><span class="tx"></span></span>';
      tile.querySelector('.ic').textContent = d.icon;
      tile.querySelector('.lb').textContent = d.label;
      tile.querySelector('.tx').textContent = d.text;
      details.appendChild(tile);
    });
    const yes = $('#invYes');
    yes.textContent = INV.yes;
    no.textContent = INV.no;
    $('#invDoneTitle').textContent = INV.accepted;
    $('#invDoneNote').textContent = INV.acceptedNote || '';

    envWrap.addEventListener('click', () => {
      if (envelope.classList.contains('open')) return;
      envelope.classList.add('open');
      setTimeout(() => {
        envWrap.classList.add('gone');
        card.classList.add('show');
        burst(window.innerWidth / 2, window.innerHeight / 2, 24);
      }, 1100);
    });

    // El botón "No" se escapa cada vez que se intenta pulsar
    const dodge = (e) => {
      e.preventDefault();
      e.stopPropagation();
      const area = card.getBoundingClientRect();
      const r = no.getBoundingClientRect();
      no.classList.add('dodging');
      no.style.left = rand(14, area.width - r.width - 14) + 'px';
      no.style.top = card.scrollTop + rand(14, area.height - r.height - 14) + 'px';
    };
    no.addEventListener('pointerenter', dodge);
    no.addEventListener('pointerdown', dodge);
    no.addEventListener('click', dodge);

    yes.addEventListener('click', () => {
      const r = yes.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, 44);
      card.classList.add('accepted');
      $('#invDone').classList.add('show');
      if (INV.whatsapp) {
        const url = `https://wa.me/${INV.whatsapp}?text=${encodeURIComponent(INV.whatsappMessage || INV.accepted)}`;
        setTimeout(() => window.open(url, '_blank'), 1400);
      }
    });
  }

  function openInvite() {
    closeOverlays();
    // Si ya aceptó, se muestra directamente la tarjeta
    const accepted = card.classList.contains('accepted');
    envelope.classList.remove('open');
    envWrap.classList.toggle('gone', accepted);
    card.classList.toggle('show', accepted);
    no.classList.remove('dodging');
    no.style.left = no.style.top = '';
    card.scrollTop = 0;
    $('#invite').classList.add('active');
  }
  const prevBtn = $('#prevBtn');
  const nextBtn = $('#nextBtn');
  function layout() {
    const last = current === cards.length - 1;
    cards.forEach((c, i) => {
      const off = i - current;
      const abs = Math.abs(off);
      const tx = off * 78;
      const rot = off * -32;
      const scale = abs === 0 ? 1 : .82;
      const z = abs === 0 ? 0 : -120 * abs;
      c.style.transform = `translate(-50%, -50%) translateX(${tx}%) translateZ(${z}px) rotateY(${rot}deg) scale(${scale})`;
      c.style.opacity = abs > 2 ? 0 : abs === 0 ? 1 : abs === 1 ? .55 : .2;
      c.style.filter = abs === 0 ? 'none' : 'brightness(.6)';
      c.style.zIndex = 100 - abs;
      c.style.pointerEvents = abs > 1 ? 'none' : 'auto';
      c.classList.toggle('center', abs === 0);
    });
    [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === current));
    // En la última foto el botón "siguiente" pasa a abrir la invitación
    prevBtn.disabled = current === 0;
    const gift = last && !!INV;
    nextBtn.classList.toggle('gift', gift);
    nextBtn.textContent = gift ? INV.openButton : '›';
    nextBtn.disabled = last && !INV;
  }
  function go(dir) {
    if (dir > 0 && current === cards.length - 1) {
      if (INV) openInvite();
      return;
    }
    current = Math.min(Math.max(current + dir, 0), cards.length - 1);
    layout();
  }
  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  // Deslizar con el dedo / ratón
  let sx = null;
  carousel.addEventListener('pointerdown', e => { sx = e.clientX; });
  window.addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1);
    sx = null;
  });
  layout();

  /* ---------- Carta ---------- */
  $('#loveBtn').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 36);
  });

  /* ---------- Abrir / cerrar overlays ---------- */
  function openOverlay(id) {
    const el = document.getElementById(id);
    el.classList.add('active');
    if (id === 'letter') el.querySelector('.paper-inner').scrollTop = 0;
    if (id === 'memories') { current = 0; layout(); }
  }
  function closeOverlays() {
    document.querySelectorAll('.overlay.active').forEach(o => o.classList.remove('active'));
  }
  $('#openMemories').addEventListener('click', () => openOverlay('memories'));
  $('#openLetter').addEventListener('click', () => openOverlay('letter'));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeOverlays));
}
</script>
</body>
</html>
